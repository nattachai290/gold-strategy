[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldml"
version = "0.1.0"
description = "Honest ML research harness for trading gold (XAU) after realistic costs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "pyarrow>=14",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["goldml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
